spring.application.name=edu-testing

# アプリケーションを起動するときの接続先（テストでは Testcontainers の接続先に置き換わる）
spring.datasource.url=jdbc:postgresql://localhost:5432/edu
spring.datasource.username=edu
spring.datasource.password=edu

# schema.sql でテーブルを作る（JPA にはテーブルを作らせない）
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=edu-testing
# リスナーの準備が整う前に送られたメッセージも読む
spring.kafka.consumer.auto-offset-reset=earliest
# 入荷の知らせを受け取るトピック（KafkaTemplate の既定のトピックとしても使う）
spring.kafka.template.default-topic=stock-arrivals
