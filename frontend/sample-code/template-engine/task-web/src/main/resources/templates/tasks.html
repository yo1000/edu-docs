<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>タスク一覧</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; }
    .task-list { list-style: none; padding: 0; }
    .task-list li {
      display: flex;                 /* 子要素を横に並べる */
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px solid #ccc;
    }
    .task-list li.done span { text-decoration: line-through; color: #888; }
    #message { color: crimson; }
  </style>
</head>
<body>
  <h1>タスク一覧</h1>
  <p id="message"></p>

  <p th:if="${tasks.isEmpty()}">タスクはありません</p>

  <ul class="task-list">
    <li th:each="task : ${tasks}"
        th:classappend="${task.done} ? 'done'"
        th:data-id="${task.id}">
      <span th:text="${task.title}">サンプルのタスク</span>
      <button type="button">完了切替</button>
    </li>
  </ul>

  <form th:action="@{/tasks}" method="post">
    <input type="text" name="title" placeholder="新しいタスク" required>
    <button type="submit">追加</button>
  </form>

  <script th:src="@{/js/tasks.js}"></script>
</body>
</html>
